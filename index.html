<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>Welcome to Your Holiday Home</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container">
        <header class="welcome-header">
            <h1>Welcome to Your Holiday Home</h1>
            <p class="guest-name" id="guestNames">Guest Names</p>
        </header>

        <section class="dates-section">
            <div class="date-card">
                <span class="date-label">Check In</span>
                <span class="date-value" id="checkInDate">---</span>
                <span class="time-value" id="checkInTime">---</span>
            </div>
            <div class="date-card">
                <span class="date-label">Check Out</span>
                <span class="date-value" id="checkOutDate">---</span>
                <span class="time-value" id="checkOutTime">---</span>
            </div>
        </section>

        <section class="weather-section" id="weatherSection">
            <h2>Local Weather</h2>
            <div class="weather-current" id="weatherCurrent">
                <span class="weather-temp" id="weatherTemp">--°C</span>
                <span class="weather-desc" id="weatherDesc">Loading...</span>
            </div>
            <div class="weather-forecast" id="weatherForecast"></div>
        </section>

        <section class="navigation-section">
            <button class="nav-button" onclick="window.location.href='guide.html'">
                <span class="nav-icon">🏠</span>
                <span class="nav-text">House Guide</span>
            </button>
            <button class="nav-button admin-toggle" id="adminToggle" onclick="window.location.href='admin.html'">
                <span class="nav-icon">⚙️</span>
                <span class="nav-text">Admin</span>
            </button>
        </section>
    </div>

    <script src="js/app.js"></script>
</body>
</html>
