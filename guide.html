<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
    <title>House Guide</title>
    <link rel="stylesheet" href="css/styles.css">
</head>
<body>
    <div class="container guide-container">
        <header class="guide-header">
            <button class="back-button" onclick="window.location.href='index.html'">← Back</button>
            <h1>House Guide</h1>
        </header>

        <nav class="guide-nav" id="guideNav">
            <button class="nav-btn" onclick="showSection('1About')">1 About</button>
            <button class="nav-btn" onclick="showSection('2Rules')">2 Rules</button>
            <button class="nav-btn" onclick="showSection('3ThingsToDo')">3 Things To Do</button>
            <button class="nav-btn" onclick="showSection('4FoodAndShops')">4 Food & Shops</button>
            <button class="nav-btn" onclick="showSection('5Help')">5 Help</button>
            <button class="nav-btn" onclick="showSection('6Check-Out')">6 Check Out</button>
        </nav>

        <main class="guide-content" id="guideContent">
            <section class="guide-section active" id="section-1About">
                <h2>About</h2>
                <img src="assets/images/1About/1about.png" alt="About" class="guide-image">
                <img src="assets/images/1About/2contact.png" alt="Contact" class="guide-image">
                <img src="assets/images/1About/3resort.png" alt="Resort" class="guide-image">
            </section>

            <section class="guide-section" id="section-2Rules">
                <h2>Rules</h2>
                <img src="assets/images/2Rules/1rules.png" alt="Rules" class="guide-image">
                <img src="assets/images/2Rules/2waste.png" alt="Waste" class="guide-image">
            </section>

            <section class="guide-section" id="section-3ThingsToDo">
                <h2>Things To Do</h2>
                <img src="assets/images/3ThingsToDo/10.png" alt="Things To Do 1" class="guide-image">
                <img src="assets/images/3ThingsToDo/11.png" alt="Things To Do 2" class="guide-image">
                <img src="assets/images/3ThingsToDo/12.png" alt="Things To Do 3" class="guide-image">
            </section>

            <section class="guide-section" id="section-4FoodAndShops">
                <h2>Food & Shops</h2>
                <img src="assets/images/4FoodAndShops/14.png" alt="Food & Shops 1" class="guide-image">
                <img src="assets/images/4FoodAndShops/15.png" alt="Food & Shops 2" class="guide-image">
            </section>

            <section class="guide-section" id="section-5Help">
                <h2>Help</h2>
                <img src="assets/images/5Help/1gass.png" alt="Help 1" class="guide-image">
                <img src="assets/images/5Help/2gass.png" alt="Help 2" class="guide-image">
                <img src="assets/images/5Help/3gass.png" alt="Help 3" class="guide-image">
            </section>

            <section class="guide-section" id="section-6Check-Out">
                <h2>Check Out</h2>
                <img src="assets/images/6Check-Out/checkout.png" alt="Check Out" class="guide-image">
            </section>
        </main>
    </div>

    <script src="js/app.js"></script>
    <script>
        function showSection(id) {
            document.querySelectorAll('.guide-section').forEach(s => s.classList.remove('active'));
            document.querySelectorAll('.nav-btn').forEach(b => b.classList.remove('active'));
            document.getElementById('section-' + id).classList.add('active');
            event.target.classList.add('active');
            document.getElementById('section-' + id).scrollIntoView({ behavior: 'smooth', block: 'start' });
        }

        document.addEventListener('DOMContentLoaded', () => {
            document.querySelector('.nav-btn').classList.add('active');
        });
    </script>
</body>
</html>
